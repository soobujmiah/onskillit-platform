<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">OnSkillIT Digital Platform Phase 0 architecture blueprint</title>
<desc id="desc">Diagram showing public site, staff console, student and client portals, API and modular domain services around PostgreSQL, private object storage, workers and provider adapters.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07140d"/><stop offset="1" stop-color="#0b2115"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#10291a"/><stop offset="1" stop-color="#0b1d13"/></linearGradient></defs>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<text x="55" y="55" fill="#8ff0ad" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="3">ONSKILLIT DIGITAL PLATFORM · PHASE 0 BLUEPRINT</text>
<text x="55" y="91" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">One modular platform, explicit domain and trust boundaries</text>
<g font-family="sans-serif">
<rect x="55" y="140" width="250" height="135" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="80" y="173" fill="#8ff0ad" font-size="13" font-weight="700">EXPERIENCE</text><text x="80" y="208" fill="#fff" font-size="20" font-weight="700">Public site</text><text x="80" y="236" fill="#b8cfc0" font-size="14">Staff console</text><text x="80" y="260" fill="#b8cfc0" font-size="14">Student + client portals</text>
<rect x="350" y="140" width="250" height="135" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="375" y="173" fill="#8ff0ad" font-size="13" font-weight="700">APPLICATION</text><text x="375" y="208" fill="#fff" font-size="20" font-weight="700">Next.js / TypeScript</text><text x="375" y="236" fill="#b8cfc0" font-size="14">App services</text><text x="375" y="260" fill="#b8cfc0" font-size="14">versioned /api/v1</text>
<rect x="645" y="140" width="500" height="135" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="670" y="173" fill="#8ff0ad" font-size="13" font-weight="700">DOMAIN MODULES</text><text x="670" y="208" fill="#fff" font-size="18" font-weight="700">Identity · CMS · Catalog · LMS · TMS · Enrollment · CRM</text><text x="670" y="236" fill="#b8cfc0" font-size="14">Commerce · Media · Notifications · Analytics · Audit</text><text x="670" y="260" fill="#b8cfc0" font-size="14">Each module owns its data and mutations.</text>
<rect x="220" y="350" width="300" height="130" rx="18" fill="#123820" stroke="#67d88c" stroke-width="2"/><text x="245" y="384" fill="#9af4b5" font-size="13" font-weight="700">AUTHORITATIVE DATA</text><text x="245" y="420" fill="#fff" font-size="21" font-weight="700">PostgreSQL</text><text x="245" y="449" fill="#c4ddcc" font-size="14">Drizzle · reviewed migrations</text>
<rect x="565" y="350" width="300" height="130" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="590" y="384" fill="#8ff0ad" font-size="13" font-weight="700">ASYNC / MEDIA</text><text x="590" y="420" fill="#fff" font-size="21" font-weight="700">Outbox + worker</text><text x="590" y="449" fill="#b8cfc0" font-size="14">S3-compatible private storage</text>
<rect x="910" y="350" width="235" height="130" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="935" y="384" fill="#8ff0ad" font-size="13" font-weight="700">PROVIDERS</text><text x="935" y="420" fill="#fff" font-size="21" font-weight="700">Email / payment</text><text x="935" y="449" fill="#b8cfc0" font-size="14">adapter boundaries</text>
<rect x="320" y="535" width="560" height="55" rx="18" fill="#18261c" stroke="#7d927f"/><text x="350" y="569" fill="#d7e2d9" font-size="14" font-weight="700">PHASE 0: DOCUMENTATION ONLY · NO APPLICATION IMPLEMENTATION YET</text>
</g>
<g stroke="#69dc8e" stroke-width="2.5" fill="none"><path d="M305 207h45"/><path d="M600 207h45"/><path d="M475 275v75"/><path d="M715 275v75"/><path d="M1000 275v75"/></g>
<text x="55" y="615" fill="#8da897" font-family="sans-serif" font-size="13">Accepted blueprint · GitHub-only implementation gates · external legal/payment/hosting facts remain owner-controlled.</text>
</svg>