name: Shell
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  locale-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:locale
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start web process
        run: |
          npm start > /tmp/onskillit-shell.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
      - name: Run shell E2E suite (locale, theme, keyboard, viewport, axe)
        run: npx playwright test playwright/shell.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
