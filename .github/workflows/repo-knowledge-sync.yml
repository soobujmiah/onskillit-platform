name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# This repository is Phase 0 (documentation only) on `main` as of this rollout: no application
# code exists here yet (it lives on the unmerged phase-01/foundation-audit-scaffold branch,
# intentionally not touched by this change). The only CI check that exists on `main` today is
# the documentation/register architecture check (`scripts/check_docs_architecture.py`), which
# this workflow treats as build.status. There is no test suite yet at this phase, so test.status
# stays "unknown" rather than being padded with a duplicate of the same check -- a future rollout
# extends this once PHASE-01's application/test suite merges into main.
#
# Two jobs, matching the pattern established on skb/ggen:
#   - test: runs tools/repo_knowledge's own unit tests (guards the vendored copy). Allowed to fail.
#   - sync: ALWAYS runs (even if `test` failed, or the docs-architecture check fails -- policy
#     rule 4/7: a failed check must still be recorded, not silently dropped), then syncs and
#     commits .repo/ back to main. paths-ignore on the push trigger stops that commit from
#     re-triggering this same workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Check canonical phase and page registers (build signal)
        id: build
        continue-on-error: true
        run: python3 scripts/check_docs_architecture.py

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
