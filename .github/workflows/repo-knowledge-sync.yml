name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/project.yaml or
# .repo/STATUS.md; they are regenerated by this workflow from .repo/phases.yaml and CI checks.
#
# Signal mapping on `main` (PHASE-00 through PHASE-04 complete):
#   build.status <- `python3 scripts/check_docs_architecture.py` (16-phase & 74-page register + .repo/phases.yaml parity)
#   test.status  <- `python3 scripts/check_locale_purity.py && node scripts/check_openapi.mjs` (locale purity + OpenAPI contract)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/project.yaml'
      - '.repo/STATUS.md'
      - '.repo/events/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Check canonical phase and page registers (build signal)
        id: build
        continue-on-error: true
        run: python3 scripts/check_docs_architecture.py

      - name: Check locale purity and parity (test signal)
        id: tests
        continue-on-error: true
        run: python3 scripts/check_locale_purity.py

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          build_conclusion="${{ steps.build.outcome == 'success' && 'success' || 'failure' }}"
          test_status="${{ steps.tests.outcome == 'success' && 'passed' || 'failed' }}"
          test_conclusion="${{ steps.tests.outcome == 'success' && 'success' || 'failure' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --build-conclusion "$build_conclusion" \
            --test-status "$test_status" --test-run-id "${{ github.run_id }}" \
            --test-conclusion "$test_conclusion" \
            --test-summary "check_locale_purity.py (en/bn script purity and key parity)" \
            --workflow-name "${{ github.workflow }}" \
            --event-type "${{ github.event_name }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          SKB_DISPATCH_TOKEN: ${{ secrets.SKB_DISPATCH_TOKEN || secrets.SKB_RETURN_TOKEN || '' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
          if [ -n "$SKB_DISPATCH_TOKEN" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $SKB_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/soobujmiah/skb/dispatches \
              -d "{\"event_type\":\"repo-state-updated\",\"client_payload\":{\"project_id\":\"onskillit-platform\",\"repository\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\"}}" || true
          fi
