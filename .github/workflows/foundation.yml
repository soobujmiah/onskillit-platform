name: Foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test public foundation and health
        run: |
          npm start > /tmp/onskillit-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/v1/health > /tmp/onskillit-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/onskillit-health.json
          curl --fail --silent http://localhost:3000/ > /tmp/onskillit-home.html
          grep -q 'OnSkillIT platform foundation' /tmp/onskillit-home.html
